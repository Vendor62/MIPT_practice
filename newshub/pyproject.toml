[project]
name = "newshub"
version = "0.1.0"
description = "NewsHub research showcase"
authors = [
  {name = "Поликарпов Дмитрий Александрович", email = "PLACEHOLDER_EMAIL"}
]
readme = "README.md"
requires-python = ">=3.12"
# license = "BUSL-1.1"
dependencies = [
  "fastapi (>=0.115.12,<0.116.0)",
  "telethon (>=1.40.0,<2.0.0)",
  "aiogram (>=3.20.0.post0,<4.0.0)",
  "sqlalchemy[asyncio] (>=2.0.41,<3.0.0)",
  "asyncpg (>=0.30.0,<0.31.0)",
  "pydantic (>=2.11.4,<3.0.0)",
  "structlog (>=25.3.0,<26.0.0)",
  "uvicorn (>=0.34.2,<0.35.0)",
  "psycopg2-binary (>=2.9.10,<3.0.0)",
  "alembic (>=1.15.2,<2.0.0)",
  "python-dotenv (>=1.0.1,<2.0.0)",
  "celery (>=5.3.0,<6.0.0)",
  "gevent (>=24.2.1,<25.0.0)",
  "aiohttp (>=3.11.0,<4.0.0)",
  "pymorphy3 (>=2.0.2,<3.0.0)",
  "razdel (>=0.5.0,<1.0.0)",
  "nltk (>=3.9.1,<4.0.0)",
  "requests (>=2.32.0,<3.0.0)",
  "requests-unixsocket (>=0.4.0,<0.5.0)"
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.11.9"
mypy = "^1.15.0"

[tool.poetry.group.embeddings]
optional = true

[tool.poetry.group.embeddings.dependencies]
sentence-transformers = ">=3.0.0,<4.0.0"
numpy = ">=1.26.0,<2.0.0"
neo4j = ">=5.0.0,<6.0.0"
gliner = ">=0.2.0"
transformers = ">=4.40.0"
sentencepiece = ">=0.2.0"
torch = ">=2.0.0"
catboost = ">=1.2.5,<2.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
