# NewsHub showcase stack — local single-machine deployment.
# Quick start:
#   cp .env.example .env
#   docker compose up -d

name: newshub

x-logging: &default_logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-db-env: &db_env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: newshub
  POSTGRES_DB: newshub
  DB_USER: newshub
  DB_PASSWORD: ${DB_PASSWORD:-change_me}

x-rabbit-env: &rabbit_env
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://change_me:change_me@rabbitmq:5672/newshub}
  CELERY_RESULT_BACKEND: rpc://
  CELERYBROKERURL: ${CELERY_BROKER_URL:-amqp://change_me:change_me@rabbitmq:5672/newshub}
  CELERYRESULTBACKEND: rpc://

x-neo4j-env: &neo4j_env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change_me_too}

x-celery-common-env: &celery_common_env
  CELERYD_PREFETCH_MULTIPLIER: "1"
  CELERY_ACKS_LATE: "true"
  CELERY_TASK_ACKS_LATE: "true"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "20"

services:
  db:
    container_name: newshub-postgres
    image: postgres:18
    environment:
      POSTGRES_USER: newshub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: newshub
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newshub -d newshub"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - newshub-network

  rabbitmq:
    container_name: newshub-rabbitmq
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: change_me
      RABBITMQ_DEFAULT_PASS: change_me
      RABBITMQ_LOOPBACK_USERS: none
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  neo4j:
    container_name: newshub-neo4j
    image: neo4j:5.25-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change_me_too}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1536m
      NEO4J_dbms_memory_transaction_total_max: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  app:
    container_name: newshub-app
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env]
      PYTHONPATH: /app
      MEDIA_DIR: /app/var/media
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./var/media:/app/var/media
      - ./var/logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  bot:
    container_name: newshub-bot
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.run_bot
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env]
      PYTHONPATH: /app
      MEDIA_DIR: /app/var/media
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-<заполнить если нужен бот>}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./var/media:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  celery_worker_summarize:
    container_name: newshub-celery-summarize
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 -Q summarize_queue
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env, *celery_common_env]
      PYTHONPATH: /app
      MEDIA_DIR: /app/var/media
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./var/media:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  celery_worker_dispatch:
    container_name: newshub-celery-dispatch
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --pool=prefork --concurrency=2 --prefetch-multiplier=1 -Q dispatch_queue
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env, *celery_common_env]
      PYTHONPATH: /app
      MEDIA_DIR: /app/var/media
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./var/media:/app/var/media
      - ./var/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  topic_worker:
    container_name: newshub-celery-topic
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 -Q topic_queue
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env, *celery_common_env]
      PYTHONPATH: /app
      MEDIA_DIR: /app/var/media
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./var/media:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  celery_beat:
    container_name: newshub-celery-beat
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env]
      PYTHONPATH: /app
      MEDIA_DIR: /app/var/media
      DIGEST_SCHEDULER_POLL_SECONDS: "15"
    volumes:
      - ./var/media:/app/var/media
      - celerybeat_data:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  celery_worker_digest:
    container_name: newshub-celery-digest
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q digest_queue -l info --pool=prefork --concurrency=1
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env, *celery_common_env]
      PYTHONPATH: /app
      MEDIA_DIR: /app/var/media
      LOG_LEVEL: INFO
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-<REDACTED>}
      DEEPSEEK_TIMEOUT: "45"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./var/media:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  embeddings_service:
    container_name: newshub-embeddings-service
    build:
      context: .
      dockerfile: embeddings_service/Dockerfile
    image: newshub-embeddings:latest
    command: uvicorn main:app --host 0.0.0.0 --port 9001
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env]
      MEDIA_DIR: /app/var/media
      HF_HOME: /root/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./var/media:/app/var/media
      - hf_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:9001:9001"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  embeddings_worker:
    container_name: newshub-embeddings-worker
    image: newshub-embeddings:latest
    command: celery -A celery_app worker --loglevel=info --pool=solo --concurrency=1 -Q embeddings_queue
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env]
      MEDIA_DIR: /app/var/media
      HF_HOME: /root/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./var/media:/app/var/media
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  embeddings_worker_ie:
    container_name: newshub-embeddings-worker-ie
    image: newshub-embeddings:latest
    command: celery -A celery_app worker --loglevel=info --pool=solo --concurrency=1 -Q ie_queue
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env, *neo4j_env, *celery_common_env]
      MEDIA_DIR: /app/var/media
      HF_HOME: /root/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IE_TORCH_DEVICE: ${IE_TORCH_DEVICE:-cpu}
      GLINER_MODEL: ${GLINER_MODEL:-urchade/gliner_multi-v2.1}
      REBEL_MODEL: ${REBEL_MODEL:-Babelscape/mrebel-base}
      IE_EMBED_MODEL: ${IE_EMBED_MODEL:-intfloat/multilingual-e5-large}
    volumes:
      - ./var/media:/app/var/media
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  embeddings_beat:
    container_name: newshub-embeddings-beat
    image: newshub-embeddings:latest
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env]
      MEDIA_DIR: /app/var/media
      HF_HOME: /root/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./var/media:/app/var/media
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

  embeddings_scheduler:
    container_name: newshub-embeddings-scheduler
    image: newshub-embeddings:latest
    command: python -m embeddings_service.embeddings_scheduler
    env_file:
      - .env
    environment:
      <<: [*db_env, *rabbit_env, *neo4j_env, *celery_common_env]
      MEDIA_DIR: /app/var/media
      HF_HOME: /root/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IE_SCAN_INTERVAL_SEC: ${IE_SCAN_INTERVAL_SEC:-60}
    volumes:
      - ./var/media:/app/var/media
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    networks:
      - newshub-network

networks:
  newshub-network:
    name: newshub-network

volumes:
  postgres_data:
  rabbitmq_data:
  neo4j_data:
  neo4j_logs:
  hf_cache:
  celerybeat_data:
